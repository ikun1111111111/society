# ============================================================
# 象罔社团官网 · Nginx 站点配置
# 放置路径：/etc/nginx/conf.d/xiangwang.conf
# 站点根目录：/var/www/xiangwang   （即仓库里的 v3/ 目录内容）
# ============================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 换成你的域名，如 club.example.com

    root  /var/www/xiangwang;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/xiangwang.access.log;
    error_log  /var/log/nginx/xiangwang.error.log;

    # ---------- 压缩：静态站收益极大 ----------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # ---------- 缓存策略 ----------
    # 字体/图片/样式/脚本：内容变了文件名跟着变（或可接受长缓存）
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 路由 ----------
    # 目录 /xxx/ 优先取 /xxx/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 403/404 统一回首页（站点是 .html 多页结构，避免裸露 404）
    error_page 404 /index.html;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
